{% extends 'base.html' %}{% block content %}<section class="pagehead"><p class="eyebrow">إدارة المتجر</p><h1>خصومات الأقسام</h1><p>للحماية، عيّن متغير البيئة ADMIN_PASSWORD في Render قبل استخدام الصفحة.</p></section><form class="checkout" method="post"><input type="password" name="password" required placeholder="كلمة مرور الإدارة"><select name="category">{% for c in categories %}<option>{{c}}</option>{% endfor %}</select><input type="number" name="percent" min="0" max="90" required placeholder="نسبة الخصم 0 - 90"><button class="goldbtn">حفظ الخصم</button></form><div class="cartlist">{% for c,p in discounts.items() %}<div class="cartline"><b>{{c}}</b><span>{{p}}% خصم</span></div>{% endfor %}</div>{% endblock %}
